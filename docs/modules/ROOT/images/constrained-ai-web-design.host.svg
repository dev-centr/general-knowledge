<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored source. Host inline: CSS variables with light fallbacks, no prefers-color-scheme block. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="constrained-ai-title" aria-describedby="constrained-ai-desc">
  <title id="constrained-ai-title">Open prompts drift; a locked contract stays even</title>
  <desc id="constrained-ai-desc">Two panels. The left panel shows three cards with different corner radii after separate prompts. The right panel shows one surface, equal rows, and a single radius after the visual language is locked.</desc>
  <style>
    :where(:root) {
      --themed-svg-diagram-color-canvas: #f3f1ec;
      --themed-svg-diagram-color-surface-primary: #ffffff;
      --themed-svg-diagram-color-surface-secondary: #e8f0ea;
      --themed-svg-diagram-color-text-primary: #1a1a1a;
      --themed-svg-diagram-color-text-muted: #3d4a44;
      --themed-svg-diagram-color-border-primary: #2c2c2c;
      --themed-svg-diagram-color-accent-primary: #1f3a2e;
      --themed-svg-diagram-color-status-danger: #f6e8e6;
      --themed-svg-diagram-color-status-danger-border: #7a3a32;
    }
    text {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--themed-svg-diagram-color-text-primary, #1a1a1a);
    }
    .canvas { fill: var(--themed-svg-diagram-color-canvas, #f3f1ec); }
    .panel-open {
      fill: var(--themed-svg-diagram-color-status-danger, #f6e8e6);
      stroke: var(--themed-svg-diagram-color-status-danger-border, #7a3a32);
    }
    .panel-locked {
      fill: var(--themed-svg-diagram-color-surface-secondary, #e8f0ea);
      stroke: var(--themed-svg-diagram-color-accent-primary, #1f3a2e);
    }
    .chip {
      fill: var(--themed-svg-diagram-color-surface-primary, #ffffff);
      stroke: var(--themed-svg-diagram-color-border-primary, #2c2c2c);
    }
    .muted { fill: var(--themed-svg-diagram-color-text-muted, #3d4a44); }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .body { font-size: 15px; }
  </style>
  <rect class="canvas" x="0" y="0" width="920" height="380"/>
  <rect class="panel-open" x="20" y="20" width="420" height="340" rx="12" stroke-width="2"/>
  <rect class="panel-locked" x="480" y="20" width="420" height="340" rx="12" stroke-width="2"/>

  <text class="kicker" x="44" y="52">OPEN PROMPTS</text>
  <text class="body" x="44" y="80">Each prompt only finishes that feature.</text>
  <text class="body" x="44" y="104">The model chooses color, type, spacing.</text>

  <rect class="chip" x="48" y="128" width="104" height="78" rx="2" stroke-width="2"/>
  <rect class="chip" x="168" y="140" width="104" height="58" rx="22" stroke-width="2"/>
  <rect class="chip" x="288" y="122" width="120" height="88" rx="10" stroke-width="2"/>
  <text class="muted body" x="48" y="230">radius 2</text>
  <text class="muted body" x="168" y="230">radius 22</text>
  <text class="muted body" x="288" y="230">radius 10</text>

  <text class="body" x="44" y="272">The next prompt picks a new shadow.</text>
  <text class="body" x="44" y="296">Empty sections become icon tiles.</text>
  <text class="muted body" x="44" y="332">Same product. Three different cards.</text>

  <text class="kicker" x="504" y="52">LOCKED CONTRACT</text>
  <text class="body" x="504" y="80">Tokens, type, and hierarchy are set.</text>
  <text class="body" x="504" y="104">The model writes markup inside them.</text>

  <rect class="chip" x="508" y="124" width="368" height="96" rx="8" stroke-width="2"/>
  <rect class="chip" x="524" y="140" width="16" height="16" rx="2" stroke-width="2"/>
  <rect class="chip" x="524" y="164" width="16" height="16" rx="2" stroke-width="2"/>
  <rect class="chip" x="524" y="188" width="16" height="16" rx="2" stroke-width="2"/>
  <text class="body" x="552" y="154">brief.md</text>
  <text class="body" x="552" y="178">diff</text>
  <text class="body" x="552" y="202">notes</text>

  <text class="body" x="504" y="260">Sections show the product UI.</text>
  <text class="body" x="504" y="284">One radius. One spacing scale.</text>
  <text class="muted body" x="504" y="332">A later pass only tightens the rest.</text>
</svg>
