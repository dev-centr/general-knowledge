<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Three altitudes of reliability</title>
  <desc id="desc">Nested bands: machine reliability inside developer-ecosystem reliability inside internet reliability.</desc>
  <defs>
    <style>
      .bg { fill: #f3f1ec; }
      .band3 { fill: #d7e3f4; stroke: #2c3e5a; stroke-width: 2; }
      .band2 { fill: #e4efe6; stroke: #1f3a2e; stroke-width: 2; }
      .band1 { fill: #f7f3e8; stroke: #6b5a3e; stroke-width: 2; }
      .t { font-family: Georgia, "Times New Roman", serif; fill: #1a1a1a; }
      .s { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; font-size: 13px; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; fill: #5a5a5a; font-size: 12px; letter-spacing: 0.04em; }
    </style>
  </defs>
  <rect class="bg" width="720" height="400"/>
  <text class="label" x="28" y="32">INTERNET ARCHITECTURE / RELIABILITY</text>
  <text class="t" x="28" y="62" font-size="22">Three altitudes</text>

  <rect class="band3" x="40" y="90" width="640" height="280" rx="8"/>
  <text class="t" x="60" y="122" font-size="16">Internet reliability</text>
  <text class="s" x="60" y="144">Cool URIs / citations / shared memory / reference durability</text>

  <rect class="band2" x="80" y="170" width="560" height="170" rx="8"/>
  <text class="t" x="100" y="202" font-size="16">Developer-ecosystem / DevX reliability</text>
  <text class="s" x="100" y="224">Packages / docs xrefs / agent trees / reverse consumers</text>

  <rect class="band1" x="120" y="250" width="480" height="70" rx="8"/>
  <text class="t" x="140" y="282" font-size="16">Machine reliability</text>
  <text class="s" x="140" y="304">Process / disk / host uptime</text>
</svg>
