<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Ideal mental model: account, apps, credentials</title>
  <desc id="desc">You authorize separate apps; each app owns its own consent and client credentials.</desc>
  <defs>
    <style>
      .bg { fill: #f3f1ec; }
      .panel { fill: #fff; stroke: #2c2c2c; stroke-width: 2; }
      .you { fill: #1f3a2e; }
      .app { fill: #e8f0ea; stroke: #1f3a2e; stroke-width: 2; }
      .cred { fill: #f7f3e8; stroke: #6b5a3e; stroke-width: 1.5; }
      .t { font-family: Georgia, "Times New Roman", serif; fill: #1a1a1a; }
      .t-inv { font-family: Georgia, "Times New Roman", serif; fill: #f7f3e8; }
      .s { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; font-size: 13px; }
      .s-inv { font-family: "Segoe UI", system-ui, sans-serif; fill: #e8f0ea; font-size: 12px; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; fill: #5a5a5a; font-size: 12px; letter-spacing: 0.04em; }
      .arrow { stroke: #2c2c2c; stroke-width: 1.75; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c2c2c"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="420" rx="0"/>
  <text class="label" x="32" y="36">IDEAL  apps are first-class</text>
  <text class="t" x="32" y="68" font-size="22">Account ’ Apps ’ Credentials</text>

  <rect class="you" x="32" y="110" width="200" height="220" rx="4"/>
  <text class="t-inv" x="52" y="150" font-size="18">You</text>
  <text class="s-inv" x="52" y="178">Google account</text>
  <text class="s-inv" x="52" y="200">Drive · Gmail · Calendar</text>
  <text class="s-inv" x="52" y="238">Personal trust</text>
  <text class="s-inv" x="52" y="258">and your data</text>

  <path class="arrow" d="M240,220 H300"/>

  <g transform="translate(310,100)">
    <rect class="app" x="0" y="0" width="280" height="70" rx="4"/>
    <text class="t" x="16" y="28" font-size="16">App: Composio</text>
    <text class="s" x="16" y="50">own consent · own scopes</text>
    <rect class="cred" x="300" y="8" width="220" height="54" rx="4"/>
    <text class="s" x="316" y="30">Client ID + secret</text>
    <text class="s" x="316" y="48">redirect URIs</text>
    <path class="arrow" d="M280,35 H300"/>

    <rect class="app" x="0" y="90" width="280" height="70" rx="4"/>
    <text class="t" x="16" y="118" font-size="16">App: rclone</text>
    <text class="s" x="16" y="140">own consent · own scopes</text>
    <rect class="cred" x="300" y="98" width="220" height="54" rx="4"/>
    <text class="s" x="316" y="120">Client ID + secret</text>
    <text class="s" x="316" y="138">redirect URIs</text>
    <path class="arrow" d="M280,125 H300"/>

    <rect class="app" x="0" y="180" width="280" height="70" rx="4"/>
    <text class="t" x="16" y="208" font-size="16">App: personal script</text>
    <text class="s" x="16" y="230">own consent · own scopes</text>
    <rect class="cred" x="300" y="188" width="220" height="54" rx="4"/>
    <text class="s" x="316" y="210">Client ID + secret</text>
    <text class="s" x="316" y="228">redirect URIs</text>
    <path class="arrow" d="M280,215 H300"/>
  </g>

  <text class="s" x="32" y="390">Infrastructure projects (VMs, billing) stay optional and separate from app identity.</text>
</svg>
