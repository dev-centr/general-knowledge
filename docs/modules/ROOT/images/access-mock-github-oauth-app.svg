<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <title id="title">Mock: Register a GitHub OAuth App for Cloudflare Access</title>
  <desc id="desc">Simplified GitHub form. Homepage URL is the Zero Trust team domain. Authorization callback URL ends with /cdn-cgi/access/callback. Client secret is shown redacted.</desc>
  <defs>
    <style>
      .bg { fill: #f3f1ec; }
      .chrome { fill: #e7e4dc; stroke: #2c2c2c; stroke-width: 2; }
      .win { fill: #fff; stroke: #2c2c2c; stroke-width: 2; }
      .t { font-family: Georgia, "Times New Roman", serif; fill: #1a1a1a; }
      .s { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; font-size: 13px; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; fill: #5a5a5a; font-size: 12px; letter-spacing: 0.04em; }
      .field { fill: #f7f5f0; stroke: #2c2c2c; stroke-width: 1.25; }
      .btn { fill: #1f3a2e; }
      .t-inv { font-family: "Segoe UI", system-ui, sans-serif; fill: #f7f3e8; font-size: 13px; font-weight: 600; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; fill: #1a1a1a; font-size: 13px; }
      .hint { font-family: "Segoe UI", system-ui, sans-serif; fill: #5a5a5a; font-size: 11px; }
    </style>
  </defs>
  <rect class="bg" width="840" height="520"/>
  <text class="label" x="28" y="28">SIMPLIFIED MOCK  not a live screenshot · GitHub ’ Settings ’ Developer settings ’ OAuth Apps</text>

  <rect class="win" x="28" y="48" width="784" height="448" rx="6"/>
  <rect class="chrome" x="28" y="48" width="784" height="36" rx="6"/>
  <rect class="chrome" x="28" y="66" width="784" height="18"/>
  <text class="s" x="48" y="72">github.com / settings / applications / new</text>

  <text class="t" x="56" y="118" font-size="20">Register a new OAuth application</text>
  <text class="hint" x="56" y="138">Prefer an organization-owned app so the org controls the client secret.</text>

  <text class="s" x="56" y="172">Application name</text>
  <rect class="field" x="56" y="180" width="520" height="32" rx="3"/>
  <text class="s" x="68" y="201">Team docs (Access)</text>

  <text class="s" x="56" y="236">Homepage URL</text>
  <rect class="field" x="56" y="244" width="720" height="32" rx="3"/>
  <text class="mono" x="68" y="265">https://&lt;team-name&gt;.cloudflareaccess.com</text>
  <text class="hint" x="56" y="292">Zero Trust ’ Settings ’ Team name. Not the docs hostname.</text>

  <text class="s" x="56" y="324">Authorization callback URL</text>
  <rect class="field" x="56" y="332" width="720" height="32" rx="3"/>
  <text class="mono" x="68" y="353">https://&lt;team-name&gt;.cloudflareaccess.com/cdn-cgi/access/callback</text>

  <text class="s" x="56" y="392">Client ID</text>
  <text class="mono" x="140" y="392">Iv1.""""""""""""  (copy after register)</text>
  <text class="s" x="56" y="414">Client secret</text>
  <text class="mono" x="160" y="414">""""""""""""""""  (generate once; store in the vault)</text>

  <rect class="btn" x="56" y="436" width="168" height="36" rx="4"/>
  <text class="t-inv" x="78" y="458">Register application</text>
</svg>
